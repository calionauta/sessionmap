    <!-- Blocking pre-paint theme application.
         The .dark class was previously applied from a useEffect, which runs
         after first paint: a Noite user saw a full light-palette flash on every
         load. On a screen shared with a patient that white flash is visible to
         someone in a vulnerable state. This script reads the persisted setting
         synchronously and sets the class before any paint. It is deliberately
         inline and render-blocking — a deferred module would flash too. It must
         stay in sync with SETTINGS_KEY in src/services/storage.ts. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sessionmap_settings');
          if (raw && JSON.parse(raw).theme === 'noite') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* first run, storage disabled, or corrupt value: keep the light default */
        }
      })();
    </script>
  </head>
  <!-- Body surface/colour come from src/index.css (@layer base) so the
       theme tokens apply without depending on this file being scanned. -->
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

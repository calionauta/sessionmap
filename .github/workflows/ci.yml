name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

# Allow one concurrent run per ref; cancel stale runs waiting in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (tsc --noEmit)
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build
